<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla MCQ Formatter</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-[#F4F6F9] text-gray-800 h-screen flex flex-col p-4">

    <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-4">
        <h1 class="text-lg font-bold text-[#1976D2] mb-1">Bangla MCQ Formatter</h1>
        <p class="text-xs text-gray-500 mb-4">Format directly from your selection</p>
        
        <label class="flex items-center space-x-2 cursor-pointer mb-2">
            <input type="checkbox" id="shuffleCheck" class="form-checkbox h-4 w-4 text-[#1976D2] rounded border-gray-300" checked>
            <span class="text-sm font-medium text-gray-700">Randomize Options</span>
        </label>
    </div>

    <div class="flex-1 flex flex-col mb-4 items-center justify-center border-2 border-dashed border-[#1976D2] bg-[#E3F2FD] rounded-lg p-6 text-center">
        <img src="https://i.postimg.cc/nrCC8RnH/Bangla-MCQ-Formatter-icon.png" alt="Bangla MCQ Formatter Logo" class="w-40 h-40 object-contain mb-3 rounded-2xl drop-shadow-md">
        <p class="text-sm font-semibold text-[#1976D2] mb-1">Select Text in Word</p>
        <p class="text-xs text-gray-600">Highlight the raw questions in your document, then click a format button below.</p>
    </div>

    <div class="flex flex-col space-y-2 mb-2">
        <button id="btnNormal" class="w-full bg-[#1976D2] hover:bg-[#1565C0] text-white font-semibold py-2.5 px-4 rounded transition-colors text-sm shadow-sm">
            Format Selected (Normal MCQ)
        </button>
        <button id="btnSmart" class="w-full bg-[#10B981] hover:bg-[#059669] text-white font-semibold py-2.5 px-4 rounded transition-colors text-sm shadow-sm">
            Format Selected (Smart MCQ)
        </button>
        <button id="btnFormatQuestions" class="w-full bg-[#F59E0B] hover:bg-[#D97706] text-white font-semibold py-2.5 px-4 rounded transition-colors text-sm shadow-sm mt-2">
            Number & Bold Questions
        </button>
        <!-- New English Font Fixer Button -->
        <button id="btnFixEnglishFont" class="w-full bg-[#0EA5E9] hover:bg-[#0284C7] text-white font-semibold py-2.5 px-4 rounded transition-colors text-sm shadow-sm mt-2">
            A➔a Replace English to Times New Roman
        </button>
        <!-- Converter Buttons -->
        <div class="flex space-x-2 mt-2">
            <button id="btnUniToBijoy" class="w-1/2 bg-[#6366F1] hover:bg-[#4F46E5] text-white font-semibold py-2 px-2 rounded transition-colors text-xs shadow-sm">
                Unicode ➔ Bijoy
            </button>
            <button id="btnBijoyToUni" class="w-1/2 bg-[#8B5CF6] hover:bg-[#7C3AED] text-white font-semibold py-2 px-2 rounded transition-colors text-xs shadow-sm">
                Bijoy ➔ Unicode
            </button>
        </div>
    </div>
    
    <div id="statusMsg" class="text-sm font-medium text-center hidden py-2 rounded"></div>

    <script>
        // ==========================================
        // PARSING & FORMATTING LOGIC
        // ==========================================
        const BANGLA_DIGITS = {'0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯'};
        const OPTION_ORDER = ["ক", "খ", "গ", "ঘ"];
        const OPTION_EXPORT_MAP = {"ক": "K", "খ": "L", "গ": "M", "ঘ": "N"};
        const ANSWER_EXPORT_MAP = {"ক": "P", "খ": "Q", "গ": "R", "ঘ": "S"};

        function toBanglaNumber(n) {
            return n.toString().replace(/[0-9]/g, w => BANGLA_DIGITS[w]);
        }

        function normalizeAnswerLabel(label) {
            const ENG_TO_BN = {
                "A": "ক", "B": "খ", "C": "গ", "D": "ঘ",
                "a": "ক", "b": "খ", "c": "গ", "d": "ঘ",
                "K": "ক", "L": "খ", "M": "গ", "N": "ঘ",
                "k": "ক", "l": "খ", "m": "গ", "n": "ঘ",
            };
            return ENG_TO_BN[label] || label;
        }

        function isQuestionLine(line) {
            if (/^\s*(?:\d+|[০-৯]+)\s*[\.\)।]\s*(.*)$/.test(line)) return true;
            if (/^.+[?؟]\s*$/.test(line)) return true;
            return false;
        }

        function parseQuestions(text) {
            // যদি পুরো টেক্সটটি এক লাইনে বা একই প্যারাগ্রাফে থাকে, তবে সেটিকে প্রশ্ন অনুযায়ী আলাদা করার জন্য প্রি-প্রসেসিং
            let cleanText = text.replace(/([\r\n\v]+)/g, "\n");
            let lines = cleanText.split('\n');
            let questions = [];
            let current = null;

            function flush() {
                if (current && current.question && current.options.length > 0) {
                    questions.push(current);
                }
                current = null;
            }

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // ব্যাখ্যা বা e¨vL¨v ম্যাচ করানো
                let expMatch = line.match(/^\s*(?:ব্যাখ্যা|Explanation|e¨vL¨v)\s*[:：\-\u2013\u2014]\s*(.+)$/i);
                if (expMatch && current) {
                    current.explanation = expMatch[1].trim();
                    continue;
                }

                // সঠিক উত্তর ম্যাচ করানো
                let ansMatch = line.match(/^\s*(?:সঠিক উত্তর|উত্তর|Ans|Answer|mwVK DËi|DËi)\s*[:：]?\s*(.*)$/i);
                if (ansMatch && current) {
                    let ansExtr = ansMatch[1].match(/[\(\[]?([ক-ঘA-DK-Na-dk-n])[\)\]]?/);
                    if (ansExtr) {
                        current.answer = normalizeAnswerLabel(ansExtr[1]);
                        current.original_answer = current.answer;
                    }
                    continue;
                }

                // নতুন প্রশ্ন শুরু হয়েছে কিনা চেক করা
                if (isQuestionLine(line)) {
                    flush();
                    let qMatch = line.match(/^\s*(?:\d+|[০-৯]+)\s*[\.\)।]\s*(.*)$/);
                    let qText = qMatch ? qMatch[1] : line;

                    // যদি একই লাইনেই প্রশ্ন এবং অপশনগুলো (ক, খ, গ, ঘ) একসাথে থেকে থাকে
                    let inlineOptsCheck = qText.match(/(.*?)\s+([কখঘগA-DK-Na-dk-n])[\.\)।:]\s*(.+?)(?=\s+[কখঘগA-DK-Na-dk-n][\.\)।:]|$)/g);
                    
                    if (inlineOptsCheck && inlineOptsCheck.length >= 2) {
                        // অর্থাৎ একই লাইনে প্রশ্ন ও অপশন দুটোই আছে
                        let qOnlyMatch = qText.match(/^(.*?)(?=\s+[কখঘগA-DK-Na-dk-n][\.\)।:])/);
                        let realQText = qOnlyMatch ? qOnlyMatch[1].trim() : qText;
                        
                        current = { question: realQText, options: [], answer: null, explanation: null, original_answer: null };

                        // এই এক লাইনের ভেতর থেকে সবগুলো অপশন খুঁজে বের করা
                        let optRegex = /([কখঘগA-DK-Na-dk-n])[\.\)।:]\s*([^\s]+(?:\s+[^\s]+)*?)(?=\s+[কখঘগA-DK-Na-dk-n][\.\)।:]|$)/g;
                        let matchOpt;
                        while ((matchOpt = optRegex.exec(qText)) !== null) {
                            current.options.push([normalizeAnswerLabel(matchOpt[1]), matchOpt[2].trim()]);
                        }
                    } else {
                        current = { question: qText.trim(), options: [], answer: null, explanation: null, original_answer: null };
                    }
                    continue;
                }

                if (!current) continue;

                // যদি অপশনগুলো একই লাইনে পাশাপাশি থাকে (যেমন: ক) অপশন খ) অপশন গ) অপশন ঘ) অপশন)
                let multiOptMatch = line.match(/([কখঘগA-DK-Na-dk-n])[\.\)।:]\s*(.+?)(?=\s+[কখঘগA-DK-Na-dk-n][\.\)।:]|$)/g);
                if (multiOptMatch && multiOptMatch.length >= 2) {
                    for (let mOpt of multiOptMatch) {
                        let subMatch = mOpt.match(/([কখঘগA-DK-Na-dk-n])[\.\)।:]\s*(.+)/);
                        if (subMatch) {
                            current.options.push([normalizeAnswerLabel(subMatch[1]), subMatch[2].trim()]);
                        }
                    }
                    continue;
                }

                // সাধারণ আলাদা লাইনের অপশন ম্যাচ করানো
                let optMatch1 = line.match(/^\s*\(([কখঘগK-N])\)\s*(.+?)$/);
                if (optMatch1) {
                    current.options.push([normalizeAnswerLabel(optMatch1[1]), optMatch1[2].trim()]);
                    continue;
                }
                let optMatch2 = line.match(/^\s*\(?([কখঘগA-DKLMNa-dklmn])\)?\s*[\.।:]?\s*(.+?)\s*$/);
                if (optMatch2) {
                    current.options.push([normalizeAnswerLabel(optMatch2[1]), optMatch2[2].trim()]);
                    continue;
                }

                if (current.options.length > 0) {
                    current.options[current.options.length - 1][1] += " " + line;
                } else {
                    current.question += " " + line;
                }
            }
            flush();
            return questions;
        }

        function shuffleOptions(question) {
            if (!question.options || question.options.length < 2 || !question.answer) return question;
            let originalAns = question.original_answer || question.answer;
            let correctText = null;
            
            for (let i = 0; i < question.options.length; i++) {
                if (question.options[i][0] === originalAns) {
                    correctText = question.options[i][1]; break;
                }
            }
            if (!correctText) return question;

            let shuffled = question.options.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            let newOptions = [];
            let newAnswer = null;

            for (let i = 0; i < shuffled.length; i++) {
                let newLabel = OPTION_ORDER[i] || shuffled[i][0];
                newOptions.push([newLabel, shuffled[i][1]]);
                if (shuffled[i][1] === correctText) {
                    newAnswer = newLabel;
                }
            }
            question.options = newOptions;
            question.answer = newAnswer;
            return question;
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById("statusMsg");
            el.textContent = msg;
            el.className = `text-sm font-medium text-center py-2 rounded mt-2 block ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            setTimeout(() => { el.style.display = 'none'; el.className = 'hidden'; }, 4000);
            el.style.display = 'block';
        }

        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                document.getElementById("btnNormal").onclick = () => formatSelectedText("normal");
                document.getElementById("btnSmart").onclick = () => formatSelectedText("smart");
                document.getElementById("btnFormatQuestions").onclick = formatQuestionsMacro;
                document.getElementById("btnUniToBijoy").onclick = () => runSmartConverter("UniToBijoy");
                document.getElementById("btnBijoyToUni").onclick = () => runSmartConverter("BijoyToUni");
                document.getElementById("btnFixEnglishFont").onclick = fixEnglishFont;
            }
        });

        async function formatSelectedText(type) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();

                    const text = selection.text;
                    if (!text || !text.trim()) {
                        showStatus("Please select some text in the document first!", true);
                        return;
                    }

                    // === স্বয়ংক্রিয় ফন্ট ডিটেকশন (Auto-detect Font Type) ===
                    let isUnicode = /[\u0980-\u09FF]/.test(text);
                    let targetFont = isUnicode ? "Kalpurush" : "SutonnyMJ";

                    let questions = parseQuestions(text);
                    if (questions.length === 0) {
                        showStatus("No valid questions found in selection!", true);
                        return;
                    }

                    if (document.getElementById("shuffleCheck").checked) {
                        questions = questions.map(q => shuffleOptions(q));
                    }

                    let anchorRange = selection.insertText(" ", "Replace");

                    for (let i = 0; i < questions.length; i++) {
                        let q = questions[i];
                        let safeQuestion = q.question.replace(/[\r\n\v]/g, "").trim();
                        
                        // ফন্ট অনুযায়ী নম্বর বসানো (ইউনিকোডে ০-৯, বিজয়ে 0-9)
                        let qNum = isUnicode ? toBanglaNumber(i + 1) : (i + 1);
                        
                        let qPara = anchorRange.insertParagraph(`${qNum}. ${safeQuestion}`, "Before");
                        qPara.font.name = targetFont;
                        qPara.font.size = 10.5;
                        qPara.alignment = "Justified";

                        for (let j = 0; j < Math.min(4, q.options.length); j++) {
                            let optLabel = OPTION_ORDER[j];
                            let textVal = q.options[j][1].replace(/[\r\n\v]/g, "").trim();
                            let marker = OPTION_EXPORT_MAP[optLabel] || optLabel;

                            let optPara = anchorRange.insertParagraph(marker, "Before");
                            optPara.alignment = "Justified";
                            optPara.font.name = "BanglaOMR";
                            optPara.font.size = 9;

                            let textRange = optPara.insertText(` ${textVal}`, "End");
                            textRange.font.name = targetFont;
                            textRange.font.size = 10.5;

                            if (type === "normal" && j === 3 && q.answer) {
                                let ansMarker = ANSWER_EXPORT_MAP[q.answer] || q.answer;
                                optPara.insertText("\t", "End");
                                let ansRange = optPara.insertText(ansMarker, "End");
                                ansRange.font.name = "ProshnaP";
                                ansRange.font.size = 10;
                            }
                        }

                        if (type === "normal" && q.explanation) {
                            let safeExp = q.explanation.replace(/[\r\n\v]/g, "").trim();
                            // ফন্ট অনুযায়ী ব্যাখ্যার লেবেল সেট করা
                            let expLabel = isUnicode ? "ব্যাখ্যা: " : "e¨vL¨v: ";
                            let expPara = anchorRange.insertParagraph(`${expLabel}${safeExp}`, "Before");
                            expPara.font.name = targetFont;
                            expPara.font.size = 10.5;
                        }
                    }

                    if (type === "smart") {
                        anchorRange.insertBreak("Page", "Before");
                        
                        // ফন্ট অনুযায়ী স্মার্ট এমসিকিউ এর হেডার সেট করা
                        let headerText = isUnicode ? "সঠিক উত্তর ও ব্যাখ্যা" : "mwVK DËi I e¨vL¨v";
                        let ansHeaderPara = anchorRange.insertParagraph(headerText, "Before");
                        ansHeaderPara.font.name = targetFont;
                        ansHeaderPara.font.size = 12;
                        ansHeaderPara.alignment = "Centered";
                        
                        for (let i = 0; i < questions.length; i++) {
                            let q = questions[i];
                            
                            let qNum = isUnicode ? toBanglaNumber(i + 1) : (i + 1);
                            let ansLabel = isUnicode ? "সঠিক উত্তর: " : "mwVK DËi: ";

                            let ansPara = anchorRange.insertParagraph(`${qNum}. ${ansLabel}`, "Before");
                            ansPara.font.name = targetFont;
                            ansPara.font.size = 10.5;

                            if (q.answer) {
                                let ansMarker = ANSWER_EXPORT_MAP[q.answer] || q.answer;
                                let ansRange = ansPara.insertText(ansMarker, "End");
                                ansRange.font.name = "ProshnaP";
                                ansRange.font.size = 10;
                            }

                            if (q.explanation) {
                                let safeExp = q.explanation.replace(/[\r\n\v]/g, "").trim();
                                let expLabel = isUnicode ? "ব্যাখ্যা: " : "e¨vL¨v: ";
                                let expPara = anchorRange.insertParagraph(`${expLabel}${safeExp}`, "Before");
                                expPara.font.name = targetFont;
                                expPara.font.size = 10.5;
                            }
                        }
                    }

                    anchorRange.delete();
                    await context.sync();
                    showStatus(`Successfully formatted ${questions.length} questions in ${isUnicode ? "Unicode" : "Bijoy"}!`);
                });
            } catch (error) { showStatus("Error: " + (error.message || "Unknown"), true); }
        }

        async function formatQuestionsMacro() {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    const paragraphs = selection.paragraphs;
                    paragraphs.load("items");
                    await context.sync();

                    if (paragraphs.items.length === 0) { showStatus("Please select some text first.", true); return; }
                    for (let i = 0; i < paragraphs.items.length; i++) { paragraphs.items[i].load("text"); }
                    await context.sync();

                    let matchingParagraphs = [];
                    for (let i = 0; i < paragraphs.items.length; i++) {
                        let p = paragraphs.items[i];
                        let cleanText = p.text.replace(/[\s\u00A0\u200B\r\n]+$/, "");
                        if (cleanText.length > 2) {
                            let lastChar = cleanText.slice(-1);
                            if (["?", "\u061F", "\u2014", "-", ":"].includes(lastChar)) { matchingParagraphs.push(p); }
                        }
                    }

                    if (matchingParagraphs.length > 0) {
                        let list = matchingParagraphs[0].startNewList();
                        list.load("id");
                        matchingParagraphs[0].font.bold = true;
                        matchingParagraphs[0].leftIndent = 22.32;
                        matchingParagraphs[0].firstLineIndent = -22.32;
                        await context.sync();

                        for (let i = 1; i < matchingParagraphs.length; i++) {
                            matchingParagraphs[i].attachToList(list.id, 0);
                            matchingParagraphs[i].font.bold = true;
                            matchingParagraphs[i].leftIndent = 22.32;
                            matchingParagraphs[i].firstLineIndent = -22.32;
                        }
                        await context.sync();
                    }
                    showStatus(`Task Completed! Total Questions Found: ${matchingParagraphs.length}`);
                });
            } catch (error) { showStatus("Error: " + (error.message || "Unknown"), true); }
        }

        // ==========================================
        // SMART BIJOY-UNICODE CONVERTER ENGINE 
        // ==========================================

        async function runSmartConverter(direction) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();

                    const rawText = selection.text;
                    if (!rawText || !rawText.trim()) {
                        showStatus("Please select some text to convert!", true);
                        return;
                    }

                    let isUnicode = /[\u0980-\u09FF]/.test(rawText);
                    let targetDirection = direction;
                    
                    if (isUnicode && direction === "BijoyToUni") targetDirection = "UniToBijoy";
                    else if (!isUnicode && direction === "UniToBijoy") targetDirection = "BijoyToUni";

                    let anchorRange = selection.insertText("", "Replace");

                    if (targetDirection === "UniToBijoy") {
                        // ইংরেজি লেখা, তার আগের স্পেস এবং দুপাশের ব্র্যাকেটগুলোকে একসাথে স্প্লিট করা হচ্ছে
                        let chunkRegex = /([\s\(\[\{'"‘“]*[a-zA-Z0-9]+(?:[\s\-\.\,\:\;\!\?]*[a-zA-Z0-9]+)*[\)\]\}'"’”]*)/g;
                        let textChunks = rawText.split(chunkRegex);

                        for (let i = 0; i < textChunks.length; i++) {
                            let chunk = textChunks[i];
                            if (!chunk) continue;

                            // চাংকটিতে কোনো ইংরেজি অক্ষর বা সংখ্যা থাকলে পুরো চাংকটি (স্পেস ও ব্র্যাকেটসহ) Times New Roman হবে
                            if (/[a-zA-Z0-9]/.test(chunk)) {
                                let textRange = anchorRange.insertText(chunk, "Before");
                                textRange.font.name = "Times New Roman"; 
                            } else {
                                // স্পেস, যতিচিহ্ন এবং বাংলা লেখা কনভার্ট হয়ে SutonnyMJ ফন্ট পাবে
                                let converted = convertUnicodeToBijoy(chunk);
                                let textRange = anchorRange.insertText(converted, "Before");
                                textRange.font.name = "SutonnyMJ";
                            }
                        }
                    } else {
                        // বিজয় ➔ ইউনিকোড কনভার্সন (আগের মতোই থাকবে)
                        let protectedEng = [];
                        let protectRegex = /(\([A-Za-z0-9\s\-\.\_]+\)|\[[A-Za-z0-9\s\-\.\_]+\]|"[A-Za-z0-9\s\-\.\_]+"|'[A-Za-z0-9\s\-\.\_]+')/g;
                        
                        let safeText = rawText.replace(protectRegex, function(match) {
                            protectedEng.push(match);
                            return "▲" + (protectedEng.length - 1) + "▲";
                        });

                        let converted = convertBijoyToUnicode(safeText);

                        let textChunks = converted.split(/(▲\d+▲)/g);

                        for (let i = 0; i < textChunks.length; i++) {
                            let chunk = textChunks[i];
                            if (!chunk) continue;

                            let match = chunk.match(/^▲(\d+)▲$/);
                            if (match) {
                                let engText = protectedEng[parseInt(match[1])];
                                let textRange = anchorRange.insertText(engText, "Before");
                                textRange.font.name = "Times New Roman";
                            } else {
                                let textRange = anchorRange.insertText(chunk, "Before");
                                textRange.font.name = "Kalpurush";
                            }
                        }
                    }

                    await context.sync();
                    showStatus(`Converted successfully!`);
                });
            } catch (error) { showStatus("Error: " + (error.message || "Unknown"), true); }
        }

        // --- Core Conversion Dictionaries (Fixed for লাইসেন্স/ন্স and কার্যারম্ভের/ম্ভ) ---
        
        function convertUnicodeToBijoy(text) {

        function convertBijoyToUnicode(text) {

                'eø':'ব্ল', 'K¬':'ক্ল', 'Mø':'গ্ল', 'cø':'প্ল', 'd¬':'ফ্ল',
                '\xC2':'ঞ্চ', 'Â':'ঞ্চ', '\xC3':'ঞ্ছ', 'Ã':'ঞ্ছ', '\xC4':'ঞ্জ', 'Ä':'ঞ্জ',
                'iæ':'রু', 'i~':'রূ', 'ï':'শু', '¸':'গু', 'š‘':'ন্তু', '¯‘':'স্তু',

            };
            
            let keys = Object.keys(b2uJukta).sort((a, b) => b.length - a.length);

            };
            
            str = str.replace(/Av/g, 'আ');
            
            let out = "";
            for (let i = 0; i < str.length; i++) {
                out += b2u[str[i]] || str[i];
            }
            str = out;

            let cons = "কখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ";
            let regexOrder = new RegExp("([িেৈ])?([" + cons + "](?:\u09CD[" + cons + "])*)(©)?([াীুূৃৗ])?", "g");
            
            str = str.replace(regexOrder, function(match, preKar, cluster, ref, postKar) {
                return (ref ? "র্" : "") + cluster + (preKar || "") + (postKar || "");
            });

            str = str.replace(/অা/g, 'আ');
            str = str.replace(/েৃ/g, 'ৃ'); 
            str = str.replace(/ৌ/g, 'ৌ');

            return str;

        // ==========================================
        // ENGLISH FONT FIXER ENGINE (PROTECTED MODE)
        // ==========================================
        async function fixEnglishFont() {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();

                    const rawText = selection.text;
                    if (!rawText || !rawText.trim()) {
                        showStatus("Please select some text first!", true);
                        return;
                    }

                    // আল্ট্রা-স্মার্ট রেজেক্স: যেকোনো ইংরেজি অক্ষর, সংখ্যা এবং তার চারপাশের স্পেস, যতিচিহ্ন একসাথে ব্লক আকারে ধরবে।
                    // এতে করে বাংলা বর্ণগুলো অটোমেটিক বাদ পড়ে যাবে এবং রেজেক্স হ্যাং হবে না।
                    const chunkRegex = /[ \t\(\)\[\]\{\}\'\"‘“’”\.\,\:\;\!\?\-\/\$\%\+\=\<\>°_@#&\*\\a-zA-Z0-9]+/g;
                    let matches = rawText.match(chunkRegex);
                    
                    if (!matches) {
                        showStatus("No English text found to replace.", false);
                        return;
                    }

                    // শুধু সেই চাংকগুলো ফিল্টার করা হবে যেগুলোতে অন্তত একটি ইংরেজি অক্ষর বা সংখ্যা (0-9) আছে
                    // এবং Word API-এর লিমিট অনুযায়ী সর্বোচ্চ 255 ক্যারেক্টার রাখা হবে
                    let uniqueMatches = [...new Set(matches)]
                                        .filter(m => /[a-zA-Z0-9]/.test(m))
                                        .map(m => m.length > 255 ? m.substring(0, 255) : m)
                                        .sort((a, b) => b.length - a.length);

                    for (let i = 0; i < uniqueMatches.length; i++) {
                        let chunk = uniqueMatches[i];
                        
                        // সিলেকশনের ভেতর নির্দিষ্ট ইংরেজি চাংকটি খোঁজা হচ্ছে
                        let searchResults = selection.search(chunk, { matchCase: true });
                        searchResults.load("items/font/name");
                        await context.sync();

                        for (let j = 0; j < searchResults.items.length; j++) {
                            let item = searchResults.items[j];
                            let fontName = item.font.name;

                            // প্রোটেকশন লজিক: MCQ ফন্টগুলোকে রক্ষা করা
                            if (fontName === "BanglaOMR" || fontName === "ProshnaP") {
                                // এটি পুরোপুরি OMR বা ProshnaP ফন্ট, তাই কোনো পরিবর্তন হবে না (সুরক্ষিত)
                                continue;
                            } else if (fontName) {
                                // এটি মিক্সড নয় এমন সাধারণ ফন্ট (যেমন: Kalpurush), তাই সরাসরি TNR করে দেওয়া যায়
                                item.font.name = "Times New Roman";
                            } else {
                                // ফন্টের নাম null মানে হলো এর ভেতর MCQ ফন্ট এবং সাধারণ ফন্ট একসাথে মিক্স হয়ে আছে!
                                // তাই আমরা এটিকে ক্যারেক্টার বাই ক্যারেক্টার চেক করে শুধু MCQ ফন্ট বাদে বাকিগুলোকে TNR করবো।
                                let chars = item.search("?", { matchWildcards: true });
                                chars.load("items/font/name");
                                await context.sync();
                                
                                for (let k = 0; k < chars.items.length; k++) {
                                    let charFont = chars.items[k].font.name;
                                    if (charFont !== "BanglaOMR" && charFont !== "ProshnaP") {
                                        chars.items[k].font.name = "Times New Roman";
                                    }
                                }
                            }
                        }
                    }

                    await context.sync();
                    showStatus("English text replaced (MCQ Fonts Protected)!");
                });
            } catch (error) { 
                showStatus("Error: " + (error.message || "Unknown"), true); 
            }
        }
