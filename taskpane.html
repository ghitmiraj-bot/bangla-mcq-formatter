<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bangla MCQ Formatter</title>
    <!-- Office.js for MS Word Integration -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#F4F6F9] text-gray-800 h-screen flex flex-col p-4">

    <!-- API Key Settings Section -->
    <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-4">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-sm font-bold text-[#1976D2]">AI Configuration</h1>
            <span id="keyStatus" class="text-xs font-bold text-red-500">Key Missing</span>
        </div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key..." class="w-full text-xs p-2 border border-gray-300 rounded mb-2 focus:outline-none focus:border-[#1976D2]">
        <button onclick="saveApiKey()" class="w-full bg-[#1976D2] hover:bg-[#1565C0] text-white text-xs font-semibold py-1.5 rounded transition-colors">
            Save API Key
        </button>
    </div>

    <!-- Instruction UI -->
    <div class="flex-1 flex flex-col mb-4 items-center justify-center border-2 border-dashed border-[#10B981] bg-[#ECFDF5] rounded-lg p-6 text-center relative" id="dropZone">
        <div id="loadingSpinner" class="hidden absolute inset-0 bg-[#ECFDF5] bg-opacity-90 flex flex-col items-center justify-center z-10 rounded-lg">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8 mb-2"></div>
            <p class="text-xs font-semibold text-[#10B981]">AI is thinking...</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-[#10B981] mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <p class="text-sm font-semibold text-[#10B981] mb-1">AI Smart Processing</p>
        <p class="text-xs text-gray-600">Select raw text in Word, and let AI do the magic!</p>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col space-y-2 mb-2">
        <button onclick="processWithAI('format_mcq')" class="w-full bg-[#F59E0B] hover:bg-[#D97706] text-white font-semibold py-2.5 px-4 rounded transition-colors text-sm shadow-sm">
            ✨ AI Auto Format MCQ
        </button>
        <div class="flex space-x-2 mt-2">
            <button onclick="processWithAI('uni_to_bijoy')" class="w-1/2 bg-[#6366F1] hover:bg-[#4F46E5] text-white font-semibold py-2 px-2 rounded transition-colors text-xs shadow-sm">
                Uni ➔ Bijoy (AI)
            </button>
            <button onclick="processWithAI('bijoy_to_uni')" class="w-1/2 bg-[#8B5CF6] hover:bg-[#7C3AED] text-white font-semibold py-2 px-2 rounded transition-colors text-xs shadow-sm">
                Bijoy ➔ Uni (AI)
            </button>
        </div>
    </div>
    
    <div id="statusMsg" class="text-sm font-medium text-center hidden py-2 rounded"></div>

    <script>
        // ==========================================
        // UI & API KEY MANAGEMENT
        // ==========================================
        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                loadApiKey();
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                updateKeyStatus(true);
                showStatus('API Key saved successfully!');
            }
        }

        function loadApiKey() {
            const key = localStorage.getItem('gemini_api_key');
            if (key) {
                document.getElementById('apiKeyInput').value = key;
                updateKeyStatus(true);
            }
        }

        function updateKeyStatus(isValid) {
            const statusEl = document.getElementById('keyStatus');
            if (isValid) {
                statusEl.textContent = 'Key Active';
                statusEl.className = 'text-xs font-bold text-green-600';
            } else {
                statusEl.textContent = 'Key Missing';
                statusEl.className = 'text-xs font-bold text-red-500';
            }
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById("statusMsg");
            el.textContent = msg;
            el.className = `text-xs font-medium text-center py-2 rounded mt-2 block ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            setTimeout(() => { el.style.display = 'none'; el.className = 'hidden'; }, 5000);
            el.style.display = 'block';
        }

        function toggleLoader(show) {
            const loader = document.getElementById('loadingSpinner');
            loader.style.display = show ? 'flex' : 'none';
        }

        // ==========================================
        // SMART FREE-TIER AI SCANNER ENGINE
        // ==========================================
        async function callGeminiAPI(systemPrompt, userText) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                throw new Error("API Key is missing! Please enter and save your Gemini API Key first.");
            }

            try {
                const modelListUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
                const modelResponse = await fetch(modelListUrl);
                
                if (!modelResponse.ok) {
                    throw new Error("Failed to verify API Key. Please check your internet or key.");
                }
                
                const modelData = await modelResponse.json();
                
                // শুধুমাত্র generateContent সাপোর্ট করে এমন মডেল ফিল্টার করা (2.5 বাদ দিয়ে)
                const validModels = modelData.models.filter(m => 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes("generateContent") &&
                    !m.name.includes("2.5") 
                );

                if (validModels.length === 0) {
                    throw new Error("No usable AI models found for this API Key.");
                }

                // পেইড Pro মডেল ব্লক করে শুধুমাত্র ফ্রি Flash মডেলগুলো বেছে নেওয়া হচ্ছে
                let targetModel = validModels.find(m => m.name.includes('flash') && !m.name.includes('pro')) || 
                                  validModels.find(m => m.name.includes('flash')) || 
                                  validModels.find(m => !m.name.includes('pro')) || 
                                  validModels[0];

                const url = `https://generativelanguage.googleapis.com/v1beta/${targetModel.name}:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{
                        parts: [{ text: systemPrompt + "\n\nHere is the text to process:\n" + userText }]
                    }],
                    generationConfig: {
                        temperature: 0.1, 
                        topK: 1,
                        topP: 1
                    }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    
                    // কোটা এরর চেক করা হচ্ছে
                    if (errorData.error?.message?.includes("Quota exceeded")) {
                        throw new Error("Free limit exceeded for this model! Please wait a minute or create a new API Key.");
                    }
                    throw new Error(errorData.error?.message || "Generation failed.");
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;

            } catch (error) {
                console.error("AI Error:", error);
                throw new Error(error.message || "An unexpected error occurred with the AI.");
            }
        }

        // ==========================================
        // MAIN PROCESSING LOGIC
        // ==========================================
        async function processWithAI(action) {
            try {
                toggleLoader(true);
                
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();

                    const rawText = selection.text;
                    if (!rawText || !rawText.trim()) {
                        throw new Error("Please select some text in the Word document first!");
                    }

                    let systemPrompt = "";
                    let targetFont = "Kalpurush";

                    if (action === 'bijoy_to_uni') {
                        targetFont = "Kalpurush";
                        systemPrompt = `You are an expert Bengali text converter. The user will give you text that is typed using the 'Bijoy' (ASCII) encoding system, but it might be broken, messy, or contain English words.
                        YOUR TASK:
                        1. Convert all the Bijoy Bengali gibberish/ASCII characters into perfect Standard Unicode Bengali.
                        2. Identify and fix ANY broken 'juktoborno' (conjuncts like চ্চ, ঙ্ক, ঙ্গ, জ্ঞ, ক্ষ).
                        3. DO NOT translate the text. Just transliterate the encoding.
                        4. CRITICAL: Any actual English words, numbers, or standard punctuation marks MUST remain exactly as they are in English. Do not change English words into symbols.
                        5. Output ONLY the finalized Unicode text. Do not add any introductory or concluding remarks.`;
                    } 
                    else if (action === 'uni_to_bijoy') {
                        targetFont = "SutonnyMJ";
                        systemPrompt = `You are an expert Bengali text converter. The user will give you standard Unicode Bengali text.
                        YOUR TASK:
                        1. Convert the Unicode Bengali text into the 'Bijoy' (ASCII) encoding standard (which looks like English gibberish when viewed in a standard font).
                        2. Ensure 'juktoborno' are perfectly mapped to Bijoy ASCII codes.
                        3. CRITICAL: Any actual English words, numbers, or standard punctuation marks MUST remain exactly as they are. Keep them untouched.
                        4. Output ONLY the finalized Bijoy text. Do not add any introductory or concluding remarks.`;
                    }
                    else if (action === 'format_mcq') {
                        targetFont = "Kalpurush";
                        systemPrompt = `You are a professional Question Paper setter. The user will provide raw, unformatted Multiple Choice Questions (MCQs).
                        YOUR TASK:
                        1. Format the text beautifully. 
                        2. Number the questions sequentially using Bengali numerals (১., ২., ৩., etc.).
                        3. Format the options using Bengali letters: ক) খ) গ) ঘ).
                        4. If there is an answer or explanation, place it clearly below the options like this:
                           উত্তর: [Answer]
                           ব্যাখ্যা: [Explanation]
                        5. Fix any typos or broken Bengali fonts automatically.
                        6. Output ONLY the formatted text. Do not add any extra conversational text.`;
                    }

                    // Call the AI
                    const aiResult = await callGeminiAPI(systemPrompt, rawText);

                    // Insert the AI result back into the document
                    let anchorRange = selection.insertText(aiResult.trim(), "Replace");
                    
                    // Apply font formatting
                    anchorRange.font.name = targetFont;
                    anchorRange.font.size = 11;

                    await context.sync();
                    showStatus('Task completed perfectly by AI!');
                });
            } catch (error) {
                console.error(error);
                showStatus(error.message, true);
            } finally {
                toggleLoader(false);
            }
        }
    </script>
</body>
</html>
